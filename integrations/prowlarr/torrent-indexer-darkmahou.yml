---
id: torrent-indexer-darkmahou
name: Darkmahou (torrent-indexer)
description: "Dark Animes (darkmahou.io) — animes via torrent, servido pelo torrent-indexer"
language: pt-BR
type: public
encoding: UTF-8
links:
  - http://torrent-indexer:7006/

caps:
  categorymappings:
    - { id: Anime, cat: "TV/Anime", desc: "Anime", default: true }
    - { id: Movies, cat: Movies, desc: "Movies", default: true }

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
  allowrawsearch: true

settings: []

search:
  paths:
    - path: "indexers/darkmahou"
      response:
        type: json
  inputs:
    filter_results: "true"
    q: "{{ .Keywords }}"
  # O darkmahou indexa por ANIME (a página traz todos os episódios). O Sonarr
  # manda "Nome S01E13"/"temporada N" — removemos esses marcadores para buscar
  # só pelo nome do anime; o Sonarr filtra o episódio certo pelo título.
  keywordsfilters:
    - name: re_replace
      args: ["(?i)\\bS\\d{1,4}(E\\d{1,4})?\\b", " "]
    - name: re_replace
      args: ["(?i)\\b(temporadas?|epis[oó]dios?|seasons?|episodes?)\\s*\\d+\\b", " "]
    - name: re_replace
      args: ["\\s{2,}", " "]
    - name: trim

  rows:
    selector: $.results
    count:
      selector: $.count

  fields:
    _id:
      selector: info_hash
    download:
      selector: magnet_link
    title:
      selector: title
      filters:
        - name: append
          args: " [torrent-indexer]"
    description:
      selector: original_title
    details:
      selector: details
    infohash:
      selector: info_hash
    date:
      selector: date
    size:
      selector: size
    seeders:
      selector: seed_count
    leechers:
      selector: leech_count
    category_is_movie:
      selector: title
      filters:
        - name: regexp
          args: "(?i)\\b(BDRip Completo|Movie|Filme|1080p BD)\\b"
    category:
      text: "{{ if .Result.category_is_movie }}Movies{{ else }}Anime{{ end }}"
# json engine n/a
