---
id: torrent-indexer-vaca-torrent
name: Vaca Torrent (torrent-indexer)
description: "Vaca Torrent — filmes e séries via torrent, servido pelo torrent-indexer"
language: pt-BR
type: public
encoding: UTF-8
links:
  - http://torrent-indexer:7006/

caps:
  categorymappings:
    - { id: Movies, cat: Movies, desc: "Movies", default: true }
    - { id: TV, cat: TV, desc: "TV", default: true }

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
  allowrawsearch: true

settings: []

search:
  paths:
    - path: "indexers/vaca_torrent"
      response:
        type: json
  inputs:
    filter_results: "true"
    q: "{{ .Keywords }}"
  keywordsfilters:
    - name: tolower
    - name: re_replace
      args: ["(?i)\\b(and|es|y|et)\\b", "e"]
    - name: re_replace
      args: ["(?i)\\bs0*(\\d{1,3})[\\s._-]*e0*(\\d{1,3})\\b", "temporada $1"]
    - name: re_replace
      args: ["(?i)\\bs0*(\\d{1,3})$", "temporada $1"]

  rows:
    selector: $.results
    count:
      selector: $.count

  fields:
    # The magnet when known; otherwise the torrent-indexer link that resolves
    # it when the release is grabbed (it answers with a redirect to the magnet).
    _magnet:
      selector: magnet_link
      optional: true
    _download:
      selector: download_link
      optional: true
    download:
      text: "{{ if .Result._magnet }}{{ .Result._magnet }}{{ else }}{{ .Result._download }}{{ end }}"
    title:
      selector: title
      filters:
        - name: append
          args: " [torrent-indexer]"
    description:
      selector: original_title
    details:
      selector: details
    infohash:
      selector: info_hash
      optional: true
    date:
      selector: date
    size:
      selector: size
      optional: true
    # Not measured until the magnet is known: left empty (so the release is
    # not rejected for "0 seeders") instead of reported as zero.
    _peers_unknown:
      selector: peers_unknown
      optional: true
    _seeders:
      selector: seed_count
    _leechers:
      selector: leech_count
    seeders:
      text: "{{ if .Result._peers_unknown }}{{ else }}{{ .Result._seeders }}{{ end }}"
      optional: true
    leechers:
      text: "{{ if .Result._peers_unknown }}{{ else }}{{ .Result._leechers }}{{ end }}"
      optional: true
    imdbid:
      selector: imdb
      optional: true
      filters:
        - name: regexp
          args: "(tt\\d+)"
    category_is_tv_show:
      selector: title
      filters:
        - name: regexp
          args: "\\b(S\\d+(?:E\\d+)?)\\b"
    category:
      text: "{{ if .Result.category_is_tv_show }}TV{{ else }}Movies{{ end }}"
# json engine n/a
